# Defaults plus project overrides (buildUponDefaultConfig = true).
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 20
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
