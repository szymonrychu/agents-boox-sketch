[tools]
java = "temurin-17"
actionlint = "1.7.12"
gitleaks = "8.30.1"
python = "3.12"

[env]
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}"
ANDROID_SDK_ROOT = "{{ get_env(name='ANDROID_HOME', default=config_root ~ '/.android-sdk') }}"

[tasks.install]
description = "Install the Android SDK (cmdline-tools, platform 36, build-tools 36.0.0) under ANDROID_HOME"
shell = "bash -c"
run = '''
set -euo pipefail
url="https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
sha="0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8"
sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
if [ ! -x "$sdkmanager" ]; then
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT
  curl -sSfL -o "$tmp/cmdline-tools.zip" "$url"
  echo "$sha  $tmp/cmdline-tools.zip" | sha256sum -c -
  mkdir -p "$ANDROID_HOME/cmdline-tools"
  python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$tmp/cmdline-tools.zip" "$tmp/unpacked"
  chmod +x "$tmp"/unpacked/cmdline-tools/bin/*
  mv "$tmp/unpacked/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
fi
yes | "$sdkmanager" --licenses >/dev/null || true
"$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
'''

[tasks.lint]
description = "ktlint, detekt, Android lint and actionlint"
run = '''
./gradlew ktlintCheck detekt lint
if ls .github/workflows/*.y*ml >/dev/null 2>&1; then actionlint; fi
'''

[tasks.test]
description = "JVM unit and Robolectric tests"
run = """
./gradlew test
python3 -m unittest discover scripts/tests
"""

[tasks."test:scripts"]
description = "Unit tests of the helper scripts"
run = "python3 -m unittest discover scripts/tests -v"

[tasks.public-check]
description = "Scan the full history for secrets, private hosts and personal identity"
run = "bash scripts/public_check.sh"

[tasks."test:screenshot"]
description = "Verify Roborazzi screenshots"
run = "./gradlew verifyRoborazziDebug"

[tasks."screenshot:record"]
description = "Record Roborazzi reference screenshots"
run = "./gradlew recordRoborazziDebug"

[tasks."test:instrumented"]
description = "Instrumented tests on a running emulator or device"
run = "./gradlew connectedDebugAndroidTest"

[tasks.build]
description = "Assemble the debug APK"
run = "./gradlew assembleDebug"

[tasks."deps:verify-update"]
description = "Regenerate gradle/verification-metadata.xml over every CI task type"
run = "./gradlew --write-verification-metadata sha256 help ktlintCheck detekt lint test verifyRoborazziDebug assembleDebug assembleRelease assembleDebugAndroidTest :app:mergeDebugAndroidTestManifest"

[tasks."api:refresh"]
description = "Copy the connector openapi.json into the :core:api contract test resources (usage: mise run api:refresh <path>)"
run = 'cp "{{arg(name="path")}}" core/api/src/test/resources/openapi.json'

[tasks.fmt]
description = "Format Kotlin sources"
run = "./gradlew ktlintFormat"
