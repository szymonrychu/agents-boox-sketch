name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Enforce strict dependency verification
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.dependency.verification=strict" >> "$HOME/.gradle/gradle.properties"
      - name: Install Android SDK
        run: mise run install
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Enforce strict dependency verification
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.dependency.verification=strict" >> "$HOME/.gradle/gradle.properties"
      - name: Install Android SDK
        run: mise run install
      - run: mise run test
      - run: mise run test:screenshot

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space for the AVD userdata partition
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Enforce strict dependency verification
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.dependency.verification=strict" >> "$HOME/.gradle/gradle.properties"
      - name: Install Android SDK
        run: mise run install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          script: ./gradlew --dependency-verification strict connectedDebugAndroidTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Enforce strict dependency verification
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.dependency.verification=strict" >> "$HOME/.gradle/gradle.properties"
      - name: Install Android SDK
        run: mise run install
      - run: mise run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Public check
        env:
          PUBLIC_DENYLIST: ${{ github.event_name == 'push' && secrets.PUBLIC_DENYLIST || '' }}
        run: mise run public-check

  release:
    needs: [wrapper, lint, test, emulator, build, public-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Next version
        id: version
        run: echo "value=$(python3 scripts/next_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.version.outputs.value != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.version.outputs.value != ''
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: steps.version.outputs.value != ''
      - name: Install Android SDK
        if: steps.version.outputs.value != ''
        run: mise run install
      - name: Decode keystore
        if: steps.version.outputs.value != ''
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printenv ANDROID_KEYSTORE_B64 | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        if: steps.version.outputs.value != ''
        env:
          V: ${{ steps.version.outputs.value }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --dependency-verification strict assembleRelease \
            -PversionName="$V" -PversionCode="$(python3 scripts/version_code.py "$V")"
      - name: Verify signing certificate
        if: steps.version.outputs.value != ''
        env:
          EXPECTED: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | tr -d ':' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -z "$actual" ] || [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "signing certificate digest does not match SIGNING_CERT_SHA256" >&2
            exit 1
          fi
      - name: Stage assets
        if: steps.version.outputs.value != ''
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/agents-boox-sketch.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/agents-boox-sketch-$V.apk"
          (cd dist && sha256sum agents-boox-sketch.apk "agents-boox-sketch-$V.apk" > SHA256SUMS)
          prev="$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          python3 scripts/release_notes.py "$prev" > notes.md
      - name: Tag and release
        if: steps.version.outputs.value != ''
        env:
          V: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "refs/tags/v$V"
          gh release create "v$V" --latest --title "v$V" --notes-file notes.md \
            dist/agents-boox-sketch.apk "dist/agents-boox-sketch-$V.apk" dist/SHA256SUMS
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
